services:
  soc-triage:
    build: .
    container_name: soc-llm-triage
    environment:
      - PYTHONPATH=/app/src
    ports:
      - "8082:8082"
    restart: unless-stopped

  prometheus:
    image: prom/prometheus:latest
    container_name: soc-llm-triage-prometheus
    command:
      - --config.file=/etc/prometheus/prometheus.yml
    volumes:
      - ./deployments/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    ports:
      - "9092:9090"
    depends_on:
      - soc-triage
    restart: unless-stopped
